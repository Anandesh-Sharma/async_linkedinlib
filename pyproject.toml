[project]
name = "async_linkedinlib"
version = "0.2.0"
description = "An async Python client for LinkedIn's Android API: sessions, feed, posts, comments, search and jobs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx[http2]>=0.28,<1"]

license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anandesh Sharma"}]
keywords = ["linkedin", "asyncio", "python", "httpx", "api-client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Anandesh-Sharma/async_linkedinlib"
Repository = "https://github.com/Anandesh-Sharma/async_linkedinlib"
Issues = "https://github.com/Anandesh-Sharma/async_linkedinlib/issues"
Documentation = "https://github.com/Anandesh-Sharma/async_linkedinlib#readme"

[project.scripts]
async-linkedinlib = "async_linkedinlib.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.15", "mypy>=1.15"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_linkedinlib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Feature folders reuse test file names (test_models.py), so import by path.
addopts = "--import-mode=importlib"
# Shared test helpers such as restli_decode.py.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.11"
strict = true
